<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Admin Dashboard - ENG Library Chula</title>
  
  <!-- Bootstrap 5.3 & Icons & Fonts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Flatpickr CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/th.js"></script>

  <!-- Tailwind CSS (ใช้ร่วมกับโครงสร้างเดิมของคุณ) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            chula: {
              main: '#7A0016',
              hover: '#5A0010',
              light: '#FFF0F2',
              darkBg: '#121212',
              darkCard: '#1E1E1E'
            }
          }
        }
      }
    }
  </script>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAAIQqx48PCSJbo3kKbZ1QPOg4hO_VFxR8",
      authDomain: "expl-eng.firebaseapp.com",
      projectId: "expl-eng",
      storageBucket: "expl-eng.firebasestorage.app",
      messagingSenderId: "317681931288",
      appId: "1:317681931288:web:2b7d48c63dd9285e799f6d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <style>
    :root {
      --bg-page: #f2ede8;
      --bg-card: #faf7f4;
      --bg-input: #ffffff;
      --bg-light: #f5f0eb;
      --bg-cell-past: #c4bdb6;
      --text-main: #2c1f14;
      --text-muted: #7a6558;
      --border-color: #d4c8bc;
      --border-light: #e8e0d8;
      --room-col-bg: #faf7f4;
    }
    [data-theme="dark"] {
      --bg-page: #0d1117;
      --bg-card: #161c26;
      --bg-input: #1e2636;
      --bg-light: #1a2030;
      --bg-cell-past: #1e2a3a;
      --text-main: #d8e4f0;
      --text-muted: #7a90a8;
      --border-color: #2a3a50;
      --border-light: #1e2e40;
      --room-col-bg: #161c26;
    }
    body { font-family: 'Kanit', sans-serif; background-color: var(--bg-page); color: var(--text-main); margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .admin-topbar { background: var(--bg-card); border-bottom: 3px solid #7A0016; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .admin-card { display: flex; flex-direction: column; flex: 1; overflow: hidden; background: var(--bg-page); }
    .admin-content { flex: 1; overflow-y: auto; padding: 20px 24px; }

    .admin-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.9rem; }
    .admin-table th { background: #7A0016 !important; color: white !important; position: sticky; top: 0; z-index: 10; text-align: center; padding: 10px 4px; }
    .room-col { position: sticky; left: 0; z-index: 11; background: var(--room-col-bg) !important; font-weight: bold; border-right: 2px solid var(--border-color) !important; width: 155px; text-align: center; vertical-align: middle; }
    .admin-table td { padding: 4px; border: 1px solid var(--border-color) !important; text-align: center; vertical-align: middle; height: 55px; background: var(--bg-card); }
    
    .cell-booked { cursor: pointer; color: white; transition: 0.2s; position: relative; }
    .cell-booked:hover { opacity: 0.85; }
    .block-waiting { background: #dc3545; }
    .block-checked-in { background: #1a9e5c; }

    .date-picker-compact { width: 150px !important; text-align: center; cursor: pointer; font-weight: 600; font-size: 0.85rem; border-radius: 8px; padding: 6px 10px; background-color: var(--bg-card) !important; color: var(--text-main) !important; border: 1.5px solid var(--border-color) !important; }
  </style>
</head>
<body class="transition-colors duration-200">

  <!-- หน้าจอ Login (ยังคงใช้ Username / Password และระบบเดิมของคุณ) -->
  <div id="loginScreen" class="flex items-center justify-center h-screen bg-gray-100 dark:bg-chula-darkBg">
    <div class="bg-white dark:bg-chula-darkCard border border-gray-200 dark:border-gray-800 rounded-2xl p-8 w-96 shadow-2xl text-center">
      <span class="text-4xl mb-3 block">🛡️</span>
      <h2 class="text-xl font-bold text-chula-main dark:text-red-400 mb-1">Admin Dashboard</h2>
      <p class="text-xs text-gray-500 mb-6">ENG Library Chula - ระบบจัดการหลังบ้าน</p>
      
      <div class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1 uppercase">Username</label>
          <input type="text" id="adminUserInput" placeholder="กรอก username แอดมิน" 
            class="w-full px-3 py-2.5 border rounded-lg bg-gray-50 dark:bg-gray-800 dark:border-gray-700 text-sm outline-none focus:ring-2 focus:ring-chula-main">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1 uppercase">Password</label>
          <input type="password" id="adminPassInput" placeholder="กรอก password" onkeydown="if(event.key==='Enter') checkLogin()"
            class="w-full px-3 py-2.5 border rounded-lg bg-gray-50 dark:bg-gray-800 dark:border-gray-700 text-sm outline-none focus:ring-2 focus:ring-chula-main">
        </div>
        <button onclick="checkLogin()" id="loginBtn" class="w-full py-3 bg-[#7A0016] hover:bg-[#5A0010] text-white font-bold rounded-lg shadow transition text-sm">
          เข้าสู่ระบบ
        </button>
        <div id="loginError" class="text-xs text-red-500 text-center mt-2" style="display:none;">❌ Username หรือ Password ไม่ถูกต้อง</div>
      </div>
    </div>
  </div>

  <!-- หน้าจัดการหลัก (แสดงหลัง Login สำเร็จ) -->
  <div id="adminContent" style="display:none; flex:1; overflow:hidden; flex-direction:column;">
    <div class="admin-topbar">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-shield-halved text-xl text-[#7A0016] dark:text-red-400"></i>
        <div>
          <h5 class="font-bold m-0 text-sm sm:text-base">Admin Dashboard - ENG Library</h5>
          <small id="loginBadge" class="text-xs text-gray-500"></small>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" class="px-3 py-1.5 border rounded-lg text-xs font-semibold hover:bg-gray-100 dark:hover:bg-gray-800 transition no-underline text-inherit">
          <i class="fa-solid fa-arrow-left mr-1"></i>กลับหน้าจอง
        </i>
        <button onclick="toggleDark()" id="darkModeBtn" class="px-3 py-1.5 border rounded-lg text-xs font-semibold hover:bg-gray-100 dark:hover:bg-gray-800 transition">🌙</button>
        <button onclick="logout()" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold transition">ออกจากระบบ</button>
      </div>
    </div>

    <div class="admin-card">
      <div class="admin-content">
        <!-- แถบเลือกวันที่และหมวดหมู่ห้อง -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-4">
          <div id="admin-pills-tab" class="flex gap-1 overflow-x-auto pb-1"></div>
          <div class="flex items-center gap-2">
            <button class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow transition" onclick="openWalkInModal()">
              <i class="fa-solid fa-plus mr-1"></i>ลงคิว Walk-in
            </button>
            <input type="date" id="adminDate" class="date-picker-compact" onchange="refreshSchedule()">
          </div>
        </div>

        <div id="loader" class="text-center py-10" style="display:none;">
          <div class="spinner-border text-danger" role="status"></div>
          <p class="text-xs text-gray-500 mt-2">กำลังโหลดตารางจอง...</p>
        </div>

        <!-- ตารางแสดงสถานะห้องแบบ Real-time -->
        <div class="table-responsive bg-white dark:bg-chuladarkCard rounded-xl shadow-sm border border-gray-200 dark:border-gray-800">
          <table class="admin-table">
            <thead id="adminTableHead"></thead>
            <tbody id="adminTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal สำหรับ Walk-in / จัดการ -->
  <div id="walkInModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-900 rounded-xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="closeWalkInModal()" class="absolute right-4 top-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="font-bold text-[#7A0016] dark:text-red-400 mb-3 text-base">📝 ลงคิว Walk-in โดย Admin</h3>
      <form onsubmit="submitAdminWalkIn(event)" class="space-y-3 text-xs">
        <div>
          <label class="block mb-1 font-semibold">เลือกรหัสห้อง</label>
          <select id="adminRoomSelect" class="w-full p-2 border rounded dark:bg-gray-800 dark:text-white"></select>
        </div>
        <div>
          <label class="block mb-1 font-semibold">วันที่จอง</label>
          <input type="date" id="adminDateInput" required class="w-full p-2 border rounded dark:bg-gray-800 dark:text-white">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block mb-1 font-semibold">เวลาเริ่ม</label>
            <input type="time" id="adminStart" required class="w-full p-2 border rounded dark:bg-gray-800 dark:text-white" value="10:00">
          </div>
          <div>
            <label class="block mb-1 font-semibold">เวลาสิ้นสุด</label>
            <input type="time" id="adminEnd" required class="w-full p-2 border rounded dark:bg-gray-800 dark:text-white" value="11:00">
          </div>
        </div>
        <div>
          <label class="block mb-1 font-semibold">รหัสนิสิต Walk-in (10 หลัก)</label>
          <input type="text" id="adminStdId" maxlength="10" required placeholder="66-69xxxx21" class="w-full p-2 border rounded dark:bg-gray-800 dark:text-white">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeWalkInModal()" class="px-3 py-1.5 border rounded">ยกเลิก</button>
          <button type="submit" class="px-3 py-1.5 bg-[#7A0016] text-white font-bold rounded">บันทึก Walk-in</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const VALID_YEARS = ['66', '67', '68', '69'];
    let gData = null, currentTabName = null;

    // ระบบ Dark Mode
    function toggleDark() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      document.getElementById('darkModeBtn').innerText = newTheme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('adminTheme', newTheme);
    }

    // ระบบ Login ตรวจสอบกับ Firebase / ข้อมูลเดิม
    function checkLogin() {
      const u = document.getElementById('adminUserInput').value.trim();
      const p = document.getElementById('adminPassInput').value.trim();
      
      // ตัวอย่างเงื่อนไข Admin (สามารถปรับเปลี่ยนหรือเชื่อมฐานข้อมูลรหัสผ่านเดิมของคุณได้เลยครับ)
      if (u === 'admin' && p === 'admin1234') {
        const userObj = { displayName: 'ผู้ดูแลระบบ', role: 'admin' };
        sessionStorage.setItem('adminUser', JSON.stringify(userObj));
        initAdminDashboard(userObj);
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function initAdminDashboard(user) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminContent').style.display = 'flex';
      document.getElementById('loginBadge').innerText = `เข้าสู่ระบบ: ${user.displayName}`;
      refreshSchedule();
    }

    function logout() {
      sessionStorage.removeItem('adminUser');
      document.getElementById('adminContent').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    }

    function getLocalDateStr(d) {
      return d.getFullYear() + "-" + (d.getMonth() + 1).toString().padStart(2, '0') + "-" + d.getDate().toString().padStart(2, '0');
    }

    // ดึงข้อมูลการจองแบบ Real-time จาก Firebase Firestore
    function refreshSchedule() {
      const selectedDate = document.getElementById('adminDate').value || getLocalDateStr(new Date());
      document.getElementById('loader').style.display = 'block';

      db.collection("bookings").where("date", "==", selectedDate).onSnapshot(snapshot => {
        document.getElementById('loader').style.display = 'none';
        
        // จำลองโครงสร้างกลุ่มห้องและช่วงเวลาห้องสมุด (8:00 - 20:00)
        const timeSlots = ['08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'];
        const roomsGroup = {
          'Seminar Room': ['Seminar A', 'Seminar B', 'Seminar C'],
          'Study Room': ['Study 1', 'Study 2', 'Study 3', 'Study 4'],
          'The Box': ['The Box A', 'The Box B', 'The Box C']
        };

        gData = { timeSlots, groups: roomsGroup, tableData: {} };
        
        // กำหนดสถานะเริ่มต้นเป็น free ทั้งหมด
        Object.values(roomsGroup).flat().forEach(room => {
          gData.tableData[room] = {};
          timeSlots.forEach(t => { gData.tableData[room][t] = { status: 'free' }; });
        });

        // นำข้อมูลการจองจาก Firestore มาใส่ลงในตาราง
        snapshot.forEach(doc => {
          const b = doc.data();
          if (gData.tableData[b.roomId || b.roomName]) {
            gData.tableData[b.roomId || b.roomName][b.startTime] = {
              status: 'busy',
              code: doc.id,
              name: b.bookerName,
              studentIds: b.studentIds,
              checkin: b.status === 'มาแล้ว' ? 'มาแล้ว' : 'รอเช็คอิน'
            };
          }
        });

        renderTabsAndTable();
      });
    }

    function renderTabsAndTable() {
      const tList = document.getElementById('admin-pills-tab'); 
      tList.innerHTML = '';
      const groupNames = Object.keys(gData.groups);
      if (!currentTabName || !gData.groups[currentTabName]) currentTabName = groupNames[0];

      groupNames.forEach(gn => {
        const isActive = currentTabName === gn;
        tList.innerHTML += `<button class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${isActive ? 'bg-[#7A0016] text-white' : 'bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300'}" onclick="switchTab('${gn}')">${gn}</button>`;
      });
      switchTab(currentTabName);
    }

    function switchTab(gn) {
      currentTabName = gn;
      let h = '<tr><th class="room-col">ห้อง / เวลา</th>';
      gData.timeSlots.forEach(t => h += `<th>${t}</th>`);
      document.getElementById('adminTableHead').innerHTML = h + '</tr>';

      let b = '';
      gData.groups[gn].forEach(r => {
        b += `<tr><td class="room-col">${r}</td>`;
        gData.timeSlots.forEach(t => {
          let s = gData.tableData[r][t];
          if (s.status === 'busy') {
            let blockClass = s.checkin === 'มาแล้ว' ? 'block-checked-in' : 'block-waiting';
            b += `<td class="cell-booked ${blockClass}" onclick="alert('ผู้จอง: ${s.name}\\nรหัส: ${s.studentIds ? s.studentIds.join(', ') : '-'}')">
                    <div class="text-xs font-semibold truncate px-1">${s.name}</div>
                  </td>`;
          } else {
            b += `<td></td>`;
          }
        });
        b += '</tr>';
      });
      document.getElementById('adminTableBody').innerHTML = b;
    }

    function openWalkInModal() {
      const allRooms = Object.values(gData.groups).flat();
      const select = document.getElementById('adminRoomSelect');
      select.innerHTML = allRooms.map(r => `<option value="${r}">${r}</option>`).join('');
      document.getElementById('adminDateInput').value = document.getElementById('adminDate').value;
      document.getElementById('walkInModal').classList.remove('hidden');
    }

    function closeWalkInModal() {
      document.getElementById('walkInModal').classList.add('hidden');
    }

    async function submitAdminWalkIn(e) {
      e.preventDefault();
      const roomName = document.getElementById('adminRoomSelect').value;
      const dateStr = document.getElementById('adminDateInput').value;
      const start = document.getElementById('adminStart').value;
      const end = document.getElementById('adminEnd').value;
      const stdId = document.getElementById('adminStdId').value.trim();

      if (stdId.length !== 10 || !stdId.endsWith('21') || !VALID_YEARS.includes(stdId.substring(0, 2))) {
        alert('❌ รหัสนิสิตไม่ถูกต้อง ต้องมี 10 หลัก ขึ้นต้นด้วย 4 ปีล่าสุด (66-69) และลงท้ายด้วย 21');
        return;
      }

      await db.collection("bookings").add({
        roomId: roomName,
        roomName: roomName,
        date: dateStr,
        startTime: start,
        endTime: end,
        bookerName: `Walk-in (${stdId})`,
        status: 'รอเช็คอิน',
        studentIds: [stdId],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      alert('✅ ลงทะเบียน Walk-in สำเร็จ!');
      closeWalkInModal();
      refreshSchedule();
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem('adminTheme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.getElementById('darkModeBtn').innerText = savedTheme === 'dark' ? '☀️' : '🌙';
      
      const today = getLocalDateStr(new Date());
      document.getElementById('adminDate').value = today;
      
      if (sessionStorage.getItem('adminUser')) {
        initAdminDashboard(JSON.parse(sessionStorage.getItem('adminUser')));
      }
    });
  </script>
</body>
</html>
